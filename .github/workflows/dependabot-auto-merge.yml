name: Dependabot auto-merge
# Merges a Dependabot PR automatically once CI has fully passed.
# Triggers after the CI workflow finishes (any matrix shape), so there are
# no brittle required-check names to keep in sync.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Merge the Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No associated PR found on this workflow run; nothing to merge."
            exit 0
          fi
          echo "CI passed for Dependabot PR #$PR_NUMBER — merging."
          gh pr merge "$PR_NUMBER" --squash --delete-branch
